<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Neeraj Maheshwari - AI Product Manager, Agentic AI, Banking and Capital Markets" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="0.6" stop-color="#0E2A4F"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- agent network motif (right side) -->
  <g stroke="#7DD3FC" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M880 90 L980 60 L1080 110 L1010 190 L900 200 Z"/>
    <path d="M880 90 L1010 190 M980 60 L900 200 M1080 110 L900 200 M980 60 L1130 200 L1010 190"/>
  </g>
  <g fill="#5EEAD4">
    <circle cx="880" cy="90" r="7"><animate attributeName="r" values="6;9;6" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="60" r="6"/>
    <circle cx="1080" cy="110" r="8"><animate attributeName="r" values="7;10;7" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="190" r="7"/>
    <circle cx="900" cy="200" r="6"><animate attributeName="r" values="5;8;5" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="200" r="5"/>
  </g>
  <!-- rising chart line -->
  <polyline points="840,265 900,250 960,256 1020,232 1080,238 1140,205" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="420" stroke-dashoffset="420">
    <animate attributeName="stroke-dashoffset" from="420" to="0" dur="2.5s" fill="freeze"/>
  </polyline>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="86" fill="#7DD3FC" font-size="16" font-weight="700" letter-spacing="3">HELLO, I'M</text>
    <text x="62" y="146" fill="#FFFFFF" font-size="58" font-weight="800">Neeraj Maheshwari</text>
    <text x="64" y="188" fill="#E2E8F0" font-size="24" font-weight="600">AI Product Manager · Techno-Functional BA</text>
    <rect x="64" y="208" width="120" height="4" rx="2" fill="url(#line)"/>
    <text x="64" y="246" fill="#CBD5E1" font-size="18">Agentic AI  ·  Australian Mortgages  ·  Investment Banking  ·  Murex  ·  Algo Trading</text>
  </g>
</svg>
